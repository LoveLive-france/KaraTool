services:
  compiler:
    image: batonogov/pyinstaller-windows:latest
    entrypoint: /bin/bash
    working_dir: /src/
    volumes:
      - ./:/src/
    command: >
      -c "
      VERSION=$$(git describe --tags --abbrev=0 2>/dev/null || echo dev) &&
      pip install -r requirements.txt &&
      bash compile.sh KaraTool_$$VERSION $$VERSION
      "