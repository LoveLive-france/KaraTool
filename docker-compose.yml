services:
  compiler:
    image: batonogov/pyinstaller-windows:latest
    entrypoint: /bin/bash
    working_dir: /src/
    volumes:
      - ./:/src/
    command: >
      -c "
      pip install -r requirements.txt &&
      pyinstaller --noconsole --onefile --add-data 'tools/ffmpeg.exe;.' --add-data 'src/template.ass;.' src/main.py
      "