name: Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: bash build.sh "KaraTool_${{ github.ref_name }}"

      - name: Smoke test
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\KaraTool_${{ github.ref_name }}.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            Write-Error "L'executable a crashe (code $($proc.ExitCode))"
            exit 1
          }
          $proc.Kill()

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/KaraTool_${{ github.ref_name }}.exe
