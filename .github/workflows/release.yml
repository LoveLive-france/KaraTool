name: Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        shell: bash
        run: ./compile.sh "KaraTool_${{ github.ref_name }}" "${{ github.ref_name }}"

      - name: Smoke test
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\KaraTool_${{ github.ref_name }}.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            Write-Error "L'executable a crashe (code $($proc.ExitCode))"
            exit 1
          }
          $proc.Kill()

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/KaraTool_${{ github.ref_name }}.exe


  build-msi: 
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - uses: actions/checkout@v4

      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: exe
          path: dist/

      - name: Install wixl
        run: sudo apt-get install -y wixl
      
      - name: Build MSI 
        run: wixl -o KaraTool_${{ github.ref_name }}.msi karatool.wxs 

      - name: Upload msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: KaraTool_${{ github.ref_name }}.msi
  release:
    runs-on: ubuntu-latest
    needs: [build, build-msi]
    permissions:
      contents: write

    steps:
      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: msi
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/KaraTool_${{ github.ref_name }}.msi
